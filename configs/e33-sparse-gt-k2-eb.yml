# e33: SparseGT + RPEARL (data mode), num_hops = 2, euclidean attention bias (logit += slope_h * ||pos_i - pos_j|| in km).
# Copy of e32-sparse-gt-k2.yml with num_hops 2 and attn_bias: euclidean.
# Run with --p 1 (siamese L1); mlp is unused.

sparse-gt-rpearl:
  gnn:
    constr:
      input: 3
      hidden: 128
      output: 128
      layers: 3
    layer_norm: false
    dropout: true
    activation: lrelu

    sparse_gt:
      hidden_dim: 128
      num_layers: 6
      num_heads: 8
      num_hops: 2
      rpearl_samples: 30
      rpearl_num_layers: 6
      pe_k: 2
      dropout: 0.1
      attn_dropout: 0.2
      attn_bias: euclidean

  mlp:
    constr:
      input: 64
      hidden: 64
      output: 1
      layers: 3
    layer_norm: false
    dropout: true
