# e35: the e32 SparseGT k=2 model with Laplacian eigenvector positional encodings instead of RPEARL.
# lappe_k = number of eigenvectors: 64, the best validation nmae of the e35 sweep on grid stride 12 (2026-10-20);
# all k in 2..64 were within 0.69-0.71%, so the choice is within noise.
# Run with --p 1 (siamese L1); mlp is unused. rpearl_* keys are ignored in lappe mode.

sparse-gt-lappe:
  gnn:
    constr:
      input: 3
      hidden: 128
      output: 128
      layers: 3
    layer_norm: false
    dropout: true
    activation: lrelu

    sparse_gt:
      hidden_dim: 128
      num_layers: 6
      num_heads: 8
      num_hops: 2
      embedding_mode: lappe
      lappe_k: 64
      dropout: 0.1
      attn_dropout: 0.2

  mlp:
    constr:
      input: 64
      hidden: 64
      output: 1
      layers: 3
    layer_norm: false
    dropout: true
