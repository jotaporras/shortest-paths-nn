# e31: SparseGT + RPEARL (data mode), attention window num_hops = 6.
# Copy of sparse-gt-data-norway.yml with only num_hops changed. Run with --p 1 (siamese L1); mlp is unused.

sparse-gt-rpearl:
  gnn:
    constr:
      input: 3
      hidden: 128
      output: 128
      layers: 3
    layer_norm: false
    dropout: true
    activation: lrelu

    sparse_gt:
      hidden_dim: 128
      num_layers: 6
      num_heads: 8
      num_hops: 6
      rpearl_samples: 30
      rpearl_num_layers: 6
      pe_k: 2
      dropout: 0.5
      attn_dropout: 0.2

  mlp:
    constr:
      input: 64
      hidden: 64
      output: 1
      layers: 3
    layer_norm: false
    dropout: true
